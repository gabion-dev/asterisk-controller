# crates/asterisk-controller/Cargo.toml

[package]
name = "asterisk-controller"
version = "0.1.0"
description = "Runs next to Asterisk on a Gabion telephony node and controls it on behalf of the application."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
data-encoding = "2.11.1"
futures-util = "0.3.34"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
node-protocol = { path = "../node-protocol" }
phonenumber = "0.3.10"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "io-util"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
uuid = { version = "1.27.0", features = ["v4"] }

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
tokio = { version = "1.53.2", features = ["process", "rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
