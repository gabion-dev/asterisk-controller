# crates/node-protocol/Cargo.toml

[package]
name = "node-protocol"
version = "0.1.0"
description = "Message types of the Gabion node protocol, generated from the protocol description."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
regress = "0.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"

[build-dependencies]
prettyplease = "0.3.0"
schemars = "0.8"
serde_json = "1.0.154"
syn = "3.0.9"
typify = "0.8.0"
