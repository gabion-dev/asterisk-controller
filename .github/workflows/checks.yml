# .github/workflows/checks.yml

name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# =============================================================================
# Every check this repository has, on every push.
#
# The Gabion development environment does not check this code, so this
# workflow and the compiler are its whole net. Nothing here is advisory: a
# formatting difference, a linter finding, a failed test or a vector the Java
# side decodes differently all fail the run.
# =============================================================================

jobs:
  checks:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out
        uses: actions/checkout@v7

      # The toolchain is pinned in rust-toolchain.toml; rustup, which the
      # runner already has, installs exactly that version on first use.
      - name: Rust toolchain
        run: rustup show active-toolchain

      - name: Format
        run: cargo fmt --all --check

      - name: Linter (strict)
        run: cargo clippy --all-targets --locked

      - name: Host of the checks against Asterisk
        uses: ./.github/actions/asterisk-lab-host

      - name: Tests
        run: cargo test --locked

      - name: Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          # renovate: datasource=custom.java-lts depName=java
          java-version: '25'

      # Builds the Java library — generating its types from the protocol
      # description — with every compiler warning as an error, and runs it
      # through the vectors it shares with the Rust side. The libraries it
      # is built against are checked against pinned checksums
      # (java/gradle/verification-metadata.xml).
      - name: Java side against the shared vectors
        working-directory: java
        run: ./gradlew check --console=plain

  # The same checks on macOS, on both of its machines, as the release builds
  # there: code compiled for one platform only says nothing of the other —
  # what only macOS compiles is found here, not first by a release.
  macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    # As the release builds it: for macOS 13 and newer.
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Rust toolchain
        run: rustup show active-toolchain

      - name: Linter (strict)
        run: cargo clippy --all-targets --locked

      - name: Host of the checks against Asterisk
        uses: ./.github/actions/asterisk-lab-host

      - name: Tests
        run: cargo test --locked

  # A telephony node on a server is installed by the controller itself
  # (asterisk-controller install) as a systemd service. Installed here on a
  # fresh runner, as root, and judged: the node runs, SIGHUP reaches the
  # controller, a launcher that dies is started again, an install again keeps
  # the node's secret and certificate, a stop ends Asterisk first.
  install:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Rust toolchain
        run: rustup show active-toolchain

      - name: Build
        run: cargo build --locked -p asterisk-controller

      - name: Install as a telephony node
        run: sudo bash scripts/check-install.sh "${PWD}/target/debug/asterisk-controller"

  # A telephony node on AWS runs on Amazon Linux 2023: every check of the
  # repository there, on its own glibc 2.34 — the pinned Asterisk tree put in
  # place by the controller's `tree`, and run against.
  amazon-linux:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Every check on Amazon Linux 2023
        run: |
          set -euxo pipefail
          mkdir -p out
          docker run --rm \
            -v "${PWD}:/src:ro" \
            -v "${PWD}/out:/out" \
            amazonlinux:2023 \
            bash /src/scripts/build-release-linux.sh /src /out
