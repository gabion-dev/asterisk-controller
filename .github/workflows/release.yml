# .github/workflows/release.yml

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release — the version in crates/asterisk-controller/Cargo.toml (e.g. 0.1.0-dev.1)'
        required: true

permissions:
  contents: write

# =============================================================================
# One controller binary per platform and architecture, published only when
# every one of them was built and checked.
#
# Every architecture builds on a NATIVE runner (no emulation), and on it every
# check of the repository runs before the binary is kept — the controller
# against the pinned Asterisk included: a verdict obtained under emulation
# says nothing about real hardware.
#
# Linux: built inside AlmaLinux 9 (glibc 2.34), the base the Asterisk tree is
# built on, so the binary runs wherever the tree runs; the newest glibc symbol
# version it needs is held to that floor (scripts/build-release-linux.sh).
# macOS: built for macOS 13 and newer, as the tree is.
#
# Each binary is then started on hosts with nothing of ours installed — every
# Linux image the tree is verified on, every macOS a native runner exists for.
# A release with a platform missing would be a different product under the
# same tag.
#
# The Java library of the protocol is published to Maven Central with every
# release, under the same version: an application takes it as an ordinary
# dependency, and its build needs nothing of Gabion's. Central never takes a
# version back, so the library is uploaded and validated first, the GitHub
# release is created only after that, and the library is published last — a
# release never goes out half: if anything fails before the last step, the
# deployment is dropped.
#
# Secrets: SIGNING_KEY (the armored private key the library is signed with)
# and SIGNING_PASSWORD (its passphrase); CENTRAL_TOKEN_USERNAME and
# CENTRAL_TOKEN_PASSWORD (a user token of the Central Portal).
# =============================================================================

jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # The controller names its version to the application in every hello:
      # the release is that version, or it is not released.
      - name: The version asked for is the controller's
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          OWN="$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/asterisk-controller/Cargo.toml)"
          if [ "${OWN}" != "${VERSION}" ]; then
            echo "ERROR: the controller is version ${OWN}, not ${VERSION}" >&2
            exit 1
          fi

  build-linux:
    needs: [version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Build and check on the glibc floor
        run: |
          set -euxo pipefail
          mkdir -p out
          docker run --rm \
            -v "${PWD}:/src:ro" \
            -v "${PWD}/out:/out" \
            almalinux:9 \
            bash /src/scripts/build-release-linux.sh /src /out

      - name: Run on clean hosts (nothing installed)
        run: |
          set -euxo pipefail
          for img in almalinux:9-minimal almalinux:10-minimal ubuntu:22.04 ubuntu:24.04 ubuntu:26.04 debian:12 debian:13 fedora:latest; do
            echo "=== ${img} (${{ matrix.arch }}) ==="
            docker run --rm \
              -v "${PWD}:/src:ro" \
              -v "${PWD}/out:/out:ro" \
              "${img}" \
              bash /src/scripts/verify-release.sh /out/asterisk-controller
          done

      - name: Package
        run: |
          set -euxo pipefail
          ARCHIVE="asterisk-controller-linux-${{ matrix.arch }}.tar.gz"
          cp LICENSE README.md out/
          tar -czf "${ARCHIVE}" -C out asterisk-controller LICENSE README.md
          sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: asterisk-controller-linux-${{ matrix.arch }}
          path: |
            asterisk-controller-linux-${{ matrix.arch }}.tar.gz
            asterisk-controller-linux-${{ matrix.arch }}.tar.gz.sha256

  build-macos:
    needs: [version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: amd64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      # The node's state directory of the checks lives in the temporary
      # directory, and the socket of Asterisk's console inside it may not
      # be longer than 103 bytes on macOS; the default one is too long.
      TMPDIR: /tmp

    steps:
      - name: Check out
        uses: actions/checkout@v7

      # The checks reach the operators of their telephone network and its
      # stranger at addresses of their own.
      - name: Loopback addresses of the checks
        run: |
          sudo ifconfig lo0 alias 127.0.0.2 up
          sudo ifconfig lo0 alias 127.0.0.3 up

      - name: Rust toolchain
        run: rustup show active-toolchain

      - name: Format
        run: cargo fmt --all --check

      - name: Linter (strict)
        run: cargo clippy --all-targets --locked

      - name: Asterisk the controller is pinned to
        run: bash scripts/fetch-asterisk.sh

      - name: Tests
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked -p asterisk-controller

      - name: Package
        run: |
          set -euxo pipefail
          ARCHIVE="asterisk-controller-darwin-${{ matrix.arch }}.tar.gz"
          mkdir out
          cp target/release/asterisk-controller LICENSE README.md out/
          tar -czf "${ARCHIVE}" -C out asterisk-controller LICENSE README.md
          shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: asterisk-controller-darwin-${{ matrix.arch }}
          path: |
            asterisk-controller-darwin-${{ matrix.arch }}.tar.gz
            asterisk-controller-darwin-${{ matrix.arch }}.tar.gz.sha256

  verify-macos:
    # A different machine from the one that built the binary, on every macOS
    # a native runner exists for — the newest first of all: a node's Mac runs
    # the current macOS. When GitHub adds a runner for a new macOS, add it here.
    needs: [build-macos]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: arm64
            runner: macos-15
          - arch: arm64
            runner: macos-26
          # macOS 27: GitHub runs it on the image of Xcode 27 (arm64 only).
          - arch: arm64
            runner: xcode-27
          - arch: amd64
            runner: macos-15-intel
          - arch: amd64
            runner: macos-26-intel
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Download the built archive
        uses: actions/download-artifact@v8
        with:
          name: asterisk-controller-darwin-${{ matrix.arch }}

      - name: Run on a clean host
        run: |
          set -euxo pipefail
          shasum -a 256 --check "asterisk-controller-darwin-${{ matrix.arch }}.tar.gz.sha256"
          mkdir out
          tar -xzf "asterisk-controller-darwin-${{ matrix.arch }}.tar.gz" -C out
          bash scripts/verify-release.sh out/asterisk-controller

  java-library:
    needs: [version]
    runs-on: ubuntu-24.04

    steps:
      - name: Check out
        uses: actions/checkout@v7

      # The toolchain is pinned in rust-toolchain.toml: the build generates the
      # message types with `cargo run -p protocol-java`, and the service check
      # talks to a controller it builds.
      - name: Rust toolchain
        run: rustup show active-toolchain

      - name: Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      # The service check gives the controller the build record of the
      # Asterisk it is pinned to: the controller drives no other.
      - name: Asterisk the controller is pinned to
        run: bash scripts/fetch-asterisk.sh

      # Every check of the library first — the shared vectors, the service
      # connection with the controller, the documentation of what is written
      # by hand — then the bundle Central takes, signed. Its version is the
      # controller's (java/build.gradle.kts reads it from Cargo.toml).
      - name: Check and pack the library
        working-directory: java
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew check centralBundle --console=plain

      - name: Upload the bundle
        uses: actions/upload-artifact@v7
        with:
          name: central-bundle
          path: java/build/distributions/central-bundle.zip

  release:
    needs: [build-linux, verify-macos, java-library]
    runs-on: ubuntu-24.04
    # Central validates and publishes on its side, and says how far it has
    # come only when asked. If it never comes to a state, the job ends here
    # and the steps that drop an unpublished deployment run.
    timeout-minutes: 60
    env:
      CENTRAL: https://central.sonatype.com/api/v1/publisher

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      # Uploaded for validation only: nothing is published until the release
      # exists. The deployment's identifier goes to the later steps.
      - name: Upload the library to Central for validation
        id: central
        env:
          TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          TOKEN="$(printf '%s:%s' "${TOKEN_USERNAME}" "${TOKEN_PASSWORD}" | base64 -w0)"
          echo "::add-mask::${TOKEN}"
          echo "TOKEN=${TOKEN}" >> "${GITHUB_ENV}"
          ID="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${TOKEN}" \
            --form "bundle=@central-bundle.zip;type=application/octet-stream" \
            "${CENTRAL}/upload?publishingType=USER_MANAGED&name=node-protocol-${VERSION}")"
          echo "Central deployment ${ID}"
          echo "id=${ID}" >> "${GITHUB_OUTPUT}"

      # Central says how far it has come only when asked; ten seconds between
      # questions. Validated is the state to go on from; failed carries its
      # reasons, and they are printed.
      - name: Wait until Central has validated the library
        env:
          ID: ${{ steps.central.outputs.id }}
        run: |
          set -euo pipefail
          while true; do
            STATUS="$(curl --fail-with-body --silent --show-error --request POST \
              --header "Authorization: Bearer ${TOKEN}" "${CENTRAL}/status?id=${ID}")"
            STATE="$(jq -r .deploymentState <<<"${STATUS}")"
            echo "Central: ${STATE}"
            case "${STATE}" in
              VALIDATED) exit 0 ;;
              FAILED) jq . <<<"${STATUS}" >&2; exit 1 ;;
              PENDING|VALIDATING) sleep 10 ;;
              *) echo "ERROR: unexpected state ${STATE}" >&2; jq . <<<"${STATUS}" >&2; exit 1 ;;
            esac
          done

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: asterisk-controller ${{ github.event.inputs.version }}
          prerelease: ${{ contains(github.event.inputs.version, '-') }}
          body: |
            The controller of a Gabion telephony node, for Asterisk 22.11.0 (release `22.11.0-r3` of gabion-dev/asterisk-server). How to run it — the README in each archive.

            Every archive was built on a native machine of its platform, where every check of this repository passed first — the controller against the pinned Asterisk included — and was then started on clean hosts: Linux — AlmaLinux 9 and 10, Ubuntu 22.04, 24.04 and 26.04, Debian 12 and 13, Fedora; macOS — 14, 15, 26 and 27 on Apple Silicon, 15 and 26 on Intel.

            ## Platforms
            - `asterisk-controller-linux-amd64.tar.gz` — Linux x64, glibc 2.34+
            - `asterisk-controller-linux-arm64.tar.gz` — Linux ARM64, glibc 2.34+
            - `asterisk-controller-darwin-arm64.tar.gz` — macOS 13+, Apple Silicon
            - `asterisk-controller-darwin-amd64.tar.gz` — macOS 13+, Intel

            Not covered: Linux with glibc older than 2.34, musl (Alpine), Windows.

            ## Java library
            The Java side of the node protocol, of the same version, is on Maven Central: `dev.gabion:node-protocol:${{ github.event.inputs.version }}`.

            ## License
            Business Source License 1.1 — the license of the Gabion framework.
          files: |
            asterisk-controller-linux-*
            asterisk-controller-darwin-*

      # The release exists: the library of the same version goes out now.
      - name: Publish the library on Central
        env:
          ID: ${{ steps.central.outputs.id }}
        run: |
          set -euo pipefail
          # From here on the deployment is never dropped: publishing may have
          # begun even when the answer to this request is lost.
          echo "PUBLISH_ASKED=1" >> "${GITHUB_ENV}"
          curl --fail-with-body --silent --show-error --request POST \
            --header "Authorization: Bearer ${TOKEN}" "${CENTRAL}/deployment/${ID}"
          while true; do
            STATUS="$(curl --fail-with-body --silent --show-error --request POST \
              --header "Authorization: Bearer ${TOKEN}" "${CENTRAL}/status?id=${ID}")"
            STATE="$(jq -r .deploymentState <<<"${STATUS}")"
            echo "Central: ${STATE}"
            case "${STATE}" in
              PUBLISHED) exit 0 ;;
              FAILED) jq . <<<"${STATUS}" >&2; exit 1 ;;
              VALIDATED|PUBLISHING) sleep 10 ;;
              *) echo "ERROR: unexpected state ${STATE}" >&2; jq . <<<"${STATUS}" >&2; exit 1 ;;
            esac
          done

      # Anything failed before the library was published: the deployment is
      # dropped, so that nothing of this run stays waiting on Central. Once
      # publishing was asked for, nothing is dropped — the release exists, and
      # the deployment named in the log is published from the Portal.
      - name: Drop the unpublished deployment
        if: failure() && steps.central.outputs.id != '' && env.PUBLISH_ASKED != '1'
        env:
          ID: ${{ steps.central.outputs.id }}
        run: |
          set -euo pipefail
          STATE="$(curl --fail-with-body --silent --show-error --request POST \
            --header "Authorization: Bearer ${TOKEN}" "${CENTRAL}/status?id=${ID}" | jq -r .deploymentState)"
          echo "Central deployment ${ID}: ${STATE}"
          case "${STATE}" in
            VALIDATED|FAILED)
              curl --fail-with-body --silent --show-error --request DELETE \
                --header "Authorization: Bearer ${TOKEN}" "${CENTRAL}/deployment/${ID}"
              echo "dropped" ;;
            *) echo "left as it is: ${STATE}" ;;
          esac
