# .github/workflows/release.yml

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release — the version in crates/asterisk-controller/Cargo.toml (e.g. 0.1.0-dev.1)'
        required: true

permissions:
  contents: write

# =============================================================================
# One controller binary per platform and architecture, published only when
# every one of them was built and checked.
#
# Every architecture builds on a NATIVE runner (no emulation), and on it every
# check of the repository runs before the binary is kept — the controller
# against the pinned Asterisk included: a verdict obtained under emulation
# says nothing about real hardware.
#
# Linux: built inside AlmaLinux 9 (glibc 2.34), the base the Asterisk tree is
# built on, so the binary runs wherever the tree runs; the newest glibc symbol
# version it needs is held to that floor (scripts/build-release-linux.sh).
# macOS: built for macOS 13 and newer, as the tree is.
#
# Each binary is then started on hosts with nothing of ours installed — every
# Linux image the tree is verified on, every macOS a native runner exists for.
# A release with a platform missing would be a different product under the
# same tag.
#
# Nothing goes to Maven Central here. The Java library of the protocol has
# versions of its own and is published by the Library workflow, only when the
# protocol changes — Central counts every publication against a monthly limit.
# A controller release goes out only while the library's sources are exactly
# those of the library published under its version (the `library` job): the
# controller never speaks a protocol no published library speaks, and the
# release notes name that library.
# =============================================================================

jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # The controller names its version to the application in every hello:
      # the release is that version, or it is not released.
      - name: The version asked for is the controller's
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          OWN="$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/asterisk-controller/Cargo.toml)"
          if [ "${OWN}" != "${VERSION}" ]; then
            echo "ERROR: the controller is version ${OWN}, not ${VERSION}" >&2
            exit 1
          fi

  # The lock file against the OSV database: a known bulletin in what the
  # controller links refuses the release unless gabion-audit.json declares
  # it with a reason. The scanner is pinned and checked against the
  # release's checksums (Renovate proposes its releases); the judgement is
  # the organisation's audit package, the same every repository runs.
  dependencies:
    needs: [version]
    runs-on: ubuntu-24.04
    env:
      # renovate: datasource=github-releases depName=google/osv-scanner
      OSV_SCANNER_VERSION: v2.7.0
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: OSV-Scanner, pinned
        run: |
          set -euo pipefail
          base="https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}"
          curl -sSfLO "${base}/osv-scanner_linux_amd64"
          curl -sSfLO "${base}/osv-scanner_SHA256SUMS"
          grep ' osv-scanner_linux_amd64$' osv-scanner_SHA256SUMS | sha256sum -c -
          chmod +x osv-scanner_linux_amd64

      - name: Scan Cargo.lock
        run: ./osv-scanner_linux_amd64 scan source --format json --output-file cargo-scan.json -L Cargo.lock || [ $? -eq 1 ]

      # The audit package has no runtime dependencies, so lifting the
      # release-age cooldown for this one npx admits nothing but the audit
      # itself, which the organisation publishes.
      - name: Judge against gabion-audit.json
        env:
          npm_config_min_release_age: "0"
        run: npx --yes gabion-audit@0.3.0 --osv-report cargo-scan.json=cargo

  build-linux:
    needs: [version, dependencies]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Build and check on the glibc floor
        run: |
          set -euxo pipefail
          mkdir -p out
          docker run --rm \
            -v "${PWD}:/src:ro" \
            -v "${PWD}/out:/out" \
            almalinux:9 \
            bash /src/scripts/build-release-linux.sh /src /out

      - name: Run on clean hosts (nothing installed)
        run: |
          set -euxo pipefail
          for img in almalinux:9-minimal almalinux:10-minimal amazonlinux:2023 ubuntu:22.04 ubuntu:24.04 ubuntu:26.04 debian:12 debian:13 fedora:latest; do
            echo "=== ${img} (${{ matrix.arch }}) ==="
            docker run --rm \
              -v "${PWD}:/src:ro" \
              -v "${PWD}/out:/out:ro" \
              "${img}" \
              bash /src/scripts/verify-release.sh /out/asterisk-controller
          done

      - name: Package
        run: |
          set -euxo pipefail
          ARCHIVE="asterisk-controller-linux-${{ matrix.arch }}.tar.gz"
          cp LICENSE README.md out/
          tar -czf "${ARCHIVE}" -C out asterisk-controller LICENSE README.md
          sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: asterisk-controller-linux-${{ matrix.arch }}
          path: |
            asterisk-controller-linux-${{ matrix.arch }}.tar.gz
            asterisk-controller-linux-${{ matrix.arch }}.tar.gz.sha256

  build-macos:
    needs: [version, dependencies]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: amd64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Rust toolchain
        run: rustup show active-toolchain

      - name: Format
        run: cargo fmt --all --check

      - name: Linter (strict)
        run: cargo clippy --all-targets --locked

      - name: Host of the checks against Asterisk
        uses: ./.github/actions/asterisk-lab-host

      - name: Tests
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked -p asterisk-controller

      - name: Package
        run: |
          set -euxo pipefail
          ARCHIVE="asterisk-controller-darwin-${{ matrix.arch }}.tar.gz"
          mkdir out
          cp target/release/asterisk-controller LICENSE README.md out/
          tar -czf "${ARCHIVE}" -C out asterisk-controller LICENSE README.md
          shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: asterisk-controller-darwin-${{ matrix.arch }}
          path: |
            asterisk-controller-darwin-${{ matrix.arch }}.tar.gz
            asterisk-controller-darwin-${{ matrix.arch }}.tar.gz.sha256

  verify-macos:
    # A different machine from the one that built the binary, on every macOS
    # a native runner exists for — the newest first of all: a node's Mac runs
    # the current macOS. When GitHub adds a runner for a new macOS, add it here.
    needs: [build-macos]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: arm64
            runner: macos-15
          - arch: arm64
            runner: macos-26
          # macOS 27: GitHub runs it on the image of Xcode 27 (arm64 only).
          - arch: arm64
            runner: xcode-27
          - arch: amd64
            runner: macos-15-intel
          - arch: amd64
            runner: macos-26-intel
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Download the built archive
        uses: actions/download-artifact@v8
        with:
          name: asterisk-controller-darwin-${{ matrix.arch }}

      - name: Run on a clean host
        run: |
          set -euxo pipefail
          shasum -a 256 --check "asterisk-controller-darwin-${{ matrix.arch }}.tar.gz.sha256"
          mkdir out
          tar -xzf "asterisk-controller-darwin-${{ matrix.arch }}.tar.gz" -C out
          bash scripts/verify-release.sh out/asterisk-controller

  library:
    needs: [version, dependencies]
    runs-on: ubuntu-24.04

    steps:
      - name: Check out
        uses: actions/checkout@v7

      # The toolchain is pinned in rust-toolchain.toml: the build generates the
      # message types with `cargo run -p protocol-java`, and the service check
      # talks to a controller it builds.
      - name: Rust toolchain
        run: rustup show active-toolchain

      - name: Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          # renovate: datasource=custom.java-lts depName=java
          java-version: '25'

      # The service check gives the controller the build record of the
      # Asterisk it is pinned to: the controller drives no other.
      - name: Asterisk the controller is pinned to
        run: bash scripts/fetch-asterisk.sh

      # The shared vectors, the service connection with this controller, the
      # documentation of what is written by hand.
      - name: Check the library
        working-directory: java
        run: ./gradlew check --console=plain

      # The controller speaks the protocol of a published library, or it is
      # not released: a changed protocol is a new library first.
      - name: The library of this controller is published
        run: bash scripts/library-is-published.sh

  release:
    needs: [build-linux, verify-macos, library]
    runs-on: ubuntu-24.04

    steps:
      - name: Check out
        uses: actions/checkout@v7

      # The release notes name the Asterisk the controller drives; it is
      # pinned in one place, the controller's code.
      - name: The Asterisk release the controller pins
        run: |
          set -euo pipefail
          RELEASE="$(sed -n 's/^pub const RELEASE: &str = "\(.*\)";$/\1/p' \
            crates/asterisk-controller/src/asterisk_release.rs)"
          [ -n "${RELEASE}" ] || { echo "ERROR: no Asterisk release in asterisk_release.rs" >&2; exit 1; }
          echo "ASTERISK_RELEASE=${RELEASE}" >> "${GITHUB_ENV}"

      # The release notes name the library whose protocol the controller
      # speaks; the library job found it published.
      - name: The library the controller speaks
        run: |
          set -euo pipefail
          LIBRARY="$(sed -n 's/^version = "\(.*\)"$/\1/p' java/build.gradle.kts)"
          [ -n "${LIBRARY}" ] || { echo "ERROR: no version in java/build.gradle.kts" >&2; exit 1; }
          echo "LIBRARY=${LIBRARY}" >> "${GITHUB_ENV}"

      - name: Download the archives
        uses: actions/download-artifact@v8
        with:
          pattern: asterisk-controller-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: asterisk-controller ${{ github.event.inputs.version }}
          prerelease: ${{ contains(github.event.inputs.version, '-') }}
          body: |
            The controller of a Gabion telephony node, for Asterisk release `${{ env.ASTERISK_RELEASE }}` of gabion-dev/asterisk-server. How to run it — the README in each archive.

            Every archive was built on a native machine of its platform, where every check of this repository passed first — the controller against the pinned Asterisk included — and was then started on clean hosts: Linux — AlmaLinux 9 and 10, Amazon Linux 2023, Ubuntu 22.04, 24.04 and 26.04, Debian 12 and 13, Fedora; macOS — 14, 15, 26 and 27 on Apple Silicon, 15 and 26 on Intel.

            ## Platforms
            - `asterisk-controller-linux-amd64.tar.gz` — Linux x64, glibc 2.34+
            - `asterisk-controller-linux-arm64.tar.gz` — Linux ARM64, glibc 2.34+
            - `asterisk-controller-darwin-arm64.tar.gz` — macOS 13+, Apple Silicon
            - `asterisk-controller-darwin-amd64.tar.gz` — macOS 13+, Intel

            Not covered: Linux with glibc older than 2.34, musl (Alpine), Windows.

            ## Java library
            The application side of the node protocol this controller speaks is on Maven Central: `dev.gabion:node-protocol:${{ env.LIBRARY }}`.

            ## License
            Business Source License 1.1 — the license of the Gabion framework.
          files: |
            asterisk-controller-linux-*
            asterisk-controller-darwin-*
